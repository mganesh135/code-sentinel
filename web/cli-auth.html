<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Authorize CLI · Code Sentinel</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body, #root { height: 100%; }
    body { background: var(--surface); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="cli-screens.jsx"></script>

  <script type="text/babel">
    const { useState } = React;
    const params = new URLSearchParams(location.search);
    const DEVICE_CODE = (params.get('code') || 'HZQK-7M4P').toUpperCase();

    function App() {
      const [step, setStep] = useState(() => {
        const s = params.get('step');
        return s === 'authorize' || s === 'success' ? s : 'signin';
      });
      const [user, setUser] = useState(null);

      const go = (next, u) => {
        if (u) setUser(u);
        setStep(next);
        const q = new URLSearchParams(location.search);
        q.set('step', next);
        history.replaceState(null, '', '?' + q.toString());
      };

      const current = user || DEMO_CLI_USER;
      return (
        <CliShell label={`CLI · ${step}`}>
          {step === 'signin' && (
            <CliSignInStep code={DEVICE_CODE} onContinue={(u) => go('authorize', u)} />
          )}
          {step === 'authorize' && (
            <CliAuthorizeStep code={DEVICE_CODE} user={current}
              onAuthorize={() => go('success')}
              onCancel={() => go('signin')} />
          )}
          {step === 'success' && <CliSuccessStep user={current} />}
        </CliShell>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
