<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Sentinel — All screens</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body, #root { height: 100%; margin: 0; }
    /* Each artboard renders the screen at its natural width inside a fixed
       artboard frame. We pin body background to white so the artboard's
       inner card scrolls cleanly. */
    .ab-frame {
      position: absolute; inset: 0; overflow: auto;
      background: var(--bg);
    }
    /* Top toolbar over the canvas with quick links to standalone files. */
    .canvas-bar {
      position: fixed; top: 12px; right: 16px; z-index: 50;
      display: inline-flex; gap: 6px; padding: 5px;
      background: rgba(20,18,14,0.92); color: #f5f3ef;
      border-radius: 999px; backdrop-filter: blur(8px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,255,255,0.06);
      font: 12.5px/1 var(--font-sans);
    }
    .canvas-bar a {
      padding: 7px 12px; border-radius: 999px;
      color: rgba(245,243,239,0.8); text-decoration: none;
      transition: all 0.12s;
    }
    .canvas-bar a:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .canvas-bar a.primary {
      background: #fff; color: #1a1917; font-weight: 510;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div class="canvas-bar">
    <a href="prototype.html" class="primary">Open clickable prototype ↗</a>
    <a href="cli-auth.html">CLI auth flow ↗</a>
  </div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="auth-screens.jsx"></script>
  <script type="text/babel" src="app-screens.jsx"></script>
  <script type="text/babel" src="subs-account-screens.jsx"></script>
  <script type="text/babel" src="cli-screens.jsx"></script>

  <script type="text/babel">
    const noop = () => {};
    const USER = { name: 'Alex Tran', firstName: 'Alex', email: 'alex@vector.dev', initials: 'AT' };

    // Wrap each screen in a div that owns its own layout context. The
    // design canvas gives us a fixed (width × height) frame; we fill it
    // and let inner content scroll vertically if it overflows.
    const Frame = ({ children, bg }) => (
      <div className="ab-frame" style={{ background: bg || 'var(--bg)' }}>
        {children}
      </div>
    );

    function CanvasRoot() {
      return (
        <DesignCanvas>
          <DCSection id="auth" title="Authentication" subtitle="Sign-in, register, forgot password — centered card on a soft grid.">
            <DCArtboard id="login" label="Login" width={480} height={720}>
              <Frame><LoginScreen go={noop} /></Frame>
            </DCArtboard>
            <DCArtboard id="register" label="Register" width={480} height={720}>
              <Frame><RegisterScreen go={noop} /></Frame>
            </DCArtboard>
            <DCArtboard id="forgot" label="Forgot password" width={480} height={720}>
              <Frame><ForgotScreen go={noop} /></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection id="app" title="Authenticated app" subtitle="Once signed in: product info &amp; downloads, plans, account settings.">
            <DCArtboard id="dashboard" label="Product · downloads" width={1180} height={1320}>
              <Frame>
                <AppShell active="dashboard" go={noop} user={USER}>
                  <DashboardScreen go={noop} user={USER} />
                </AppShell>
              </Frame>
            </DCArtboard>
            <DCArtboard id="subs" label="Subscription tiers" width={1180} height={1380}>
              <Frame>
                <AppShell active="subscriptions" go={noop} user={USER}>
                  <SubscriptionsScreen go={noop} />
                </AppShell>
              </Frame>
            </DCArtboard>
            <DCArtboard id="account" label="Account settings" width={1180} height={1320}>
              <Frame>
                <AppShell active="account" go={noop} user={USER}>
                  <AccountScreen user={USER} go={noop} />
                </AppShell>
              </Frame>
            </DCArtboard>
          </DCSection>

          <DCSection id="cli" title="CLI authentication" subtitle="Separate page opened by `sentinel login` — device-code handshake, then success.">
            <DCArtboard id="cli-signin" label="01 · Sign in" width={520} height={780}>
              <Frame bg="var(--surface)"><CliSignInDemo /></Frame>
            </DCArtboard>
            <DCArtboard id="cli-authorize" label="02 · Authorize" width={520} height={780}>
              <Frame bg="var(--surface)"><CliAuthorizeDemo /></Frame>
            </DCArtboard>
            <DCArtboard id="cli-success" label="03 · Success" width={520} height={780}>
              <Frame bg="var(--surface)"><CliSuccessDemo /></Frame>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CanvasRoot />);
  </script>
</body>
</html>
