<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Sentinel — Prototype</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body, #root { height: 100%; }
    /* Floating prototype nav (so reviewers can jump between screens) */
    .proto-nav {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 2px; padding: 5px;
      background: rgba(20, 18, 14, 0.92); color: #f5f3ef;
      backdrop-filter: blur(8px); border-radius: 999px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,255,255,0.06);
      z-index: 100; font-family: var(--font-sans); font-size: 12.5px;
    }
    .proto-nav button {
      padding: 7px 12px; border-radius: 999px; border: 0; cursor: pointer;
      background: transparent; color: rgba(245,243,239,0.7); font: inherit;
      transition: all 0.12s;
    }
    .proto-nav button:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .proto-nav button.is-active { background: #fff; color: #1a1917; font-weight: 510; }
    .proto-nav .sep { width: 1px; height: 16px; background: rgba(255,255,255,0.1); margin: 0 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="auth-screens.jsx"></script>
  <script type="text/babel" src="app-screens.jsx"></script>
  <script type="text/babel" src="subs-account-screens.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const USER = {
      name: 'Alex Tran',
      firstName: 'Alex',
      email: 'alex@vector.dev',
      initials: 'AT',
    };

    const SCREENS = [
      { id: 'login',         label: 'Login',         group: 'auth' },
      { id: 'register',      label: 'Register',      group: 'auth' },
      { id: 'forgot',        label: 'Forgot',        group: 'auth' },
      { id: 'dashboard',     label: 'Product',       group: 'app' },
      { id: 'subscriptions', label: 'Subscription',  group: 'app' },
      { id: 'account',       label: 'Account',       group: 'app' },
    ];

    function App() {
      const [screen, setScreen] = useState(() => {
        const h = (location.hash || '').slice(1);
        return SCREENS.find(s => s.id === h) ? h : 'login';
      });

      const go = (id) => {
        setScreen(id);
        history.replaceState(null, '', '#' + id);
      };

      useEffect(() => {
        const onHash = () => {
          const h = (location.hash || '').slice(1);
          if (SCREENS.find(s => s.id === h)) setScreen(h);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      let body;
      if (screen === 'login')    body = <LoginScreen go={go} />;
      else if (screen === 'register') body = <RegisterScreen go={go} />;
      else if (screen === 'forgot')   body = <ForgotScreen go={go} />;
      else if (screen === 'dashboard')     body = <AppShell active="dashboard" go={go} user={USER}><DashboardScreen go={go} user={USER} /></AppShell>;
      else if (screen === 'subscriptions') body = <AppShell active="subscriptions" go={go} user={USER}><SubscriptionsScreen go={go} /></AppShell>;
      else if (screen === 'account')       body = <AppShell active="account" go={go} user={USER}><AccountScreen user={USER} go={go} /></AppShell>;

      return (
        <div data-screen-label={SCREENS.find(s => s.id === screen)?.label || screen}
             style={{ minHeight: '100%' }}>
          {body}
          <ProtoNav screen={screen} go={go} />
        </div>
      );
    }

    function ProtoNav({ screen, go }) {
      return (
        <div className="proto-nav">
          {SCREENS.filter(s => s.group === 'auth').map(s => (
            <button key={s.id} className={screen === s.id ? 'is-active' : ''} onClick={() => go(s.id)}>{s.label}</button>
          ))}
          <span className="sep"></span>
          {SCREENS.filter(s => s.group === 'app').map(s => (
            <button key={s.id} className={screen === s.id ? 'is-active' : ''} onClick={() => go(s.id)}>{s.label}</button>
          ))}
          <span className="sep"></span>
          <a href="cli-auth.html" target="_blank"
             style={{ padding: '7px 12px', borderRadius: 999, color: 'rgba(245,243,239,0.7)', textDecoration: 'none' }}>
            CLI auth ↗
          </a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
